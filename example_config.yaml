# SageMaker SDK V3 configuration
sagemaker_training_config:
  code_destination_s3_uri: s3://my-sagemaker-bucket/code
  sagemaker_execution_role_arn: arn:aws:iam::123456789012:role/SageMakerRole
  training_image_uri: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-training-image:latest

model_trainer_config:
  base_job_name: my-training-job-${run_id}
  source_code:
    entry_script: main.py
    requirements: requirements.txt
  compute:
    instance_type: ml.m5.large
    instance_count: 1
    enable_managed_spot_training: true
  stopping_condition:
    max_runtime_in_seconds: 3600
    max_wait_time_in_seconds: 3600
  input_data_config:
    - channel_name: train
      data_source: s3://my-sagemaker-bucket/input
  training_input_mode: FastFile
  checkpoint_config:
    s3_uri: s3://my-sagemaker-bucket/checkpoints/${run_id}
  output_data_config:
    s3_output_path: s3://my-sagemaker-bucket/output/${run_id}
  hyperparameters:
    epochs: 10
    learning_rate: 0.001

# Files/directories to exclude from the source archive
exclude_patterns:
  - "*.pyc" # Python bytecode
  - "__pycache__" # Python cache directories
  - ".git" # Git repository
  - "*.log" # Log files
  - "tests/fixtures" # 特定のディレクトリ
  - ".pytest_cache" # pytest cache
  - "*.tmp" # 一時ファイル
  - "node_modules" # Node.js依存関係（もしあれば）
